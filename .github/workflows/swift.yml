name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    # AudiobookOffline is a macOS SwiftUI/AppKit app (Package.swift targets .macOS(.v14)),
    # so this must run on a macOS runner with Xcode — GitHub's default Swift template
    # targets ubuntu-latest, which can't compile AppKit/SwiftUI imports at all.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
